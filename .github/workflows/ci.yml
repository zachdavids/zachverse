name: CI

# Every pull request, including one stacked on another PR's branch, and every push to main.
on:
  pull_request:
  push:
    branches: [main]

# Read-only token; CI never requests AWS credentials (no id-token permission).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (100% coverage required)
        run: npm run test:coverage
      - name: Build and prerender
        run: npm run build
      - name: Check prerendered output
        run: npm run check:dist
      # Chromium's headless shell, and the system libraries it needs, for the browser check (ADR 0006) and Lighthouse.
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Check the pages in a browser
        run: npm run check:browser
        env:
          # A screenshot of each page at each width, and in dark mode, for the pull request's review.
          BROWSER_CHECK_SCREENSHOTS: screenshots
      # Kept with the run for 30 days, also when the check failed, to show what it saw.
      - name: Keep the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 30
      # Lab measurements of the built pages. The deploy workflow doesn't take them: lab scores vary from run to run,
      # and this job, on the pull request, gates the merge.
      - name: Measure the pages with Lighthouse (lab)
        run: npm run check:lighthouse

  infra:
    name: Infra (typecheck, template checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Synthesized template checks (100% coverage required)
        run: npm run test:coverage
